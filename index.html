<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JBS | Seara — Consulta de Almoxarifado</title>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="desktop-mode">

<div class="app-layout segmentation-hidden" id="app-layout">
    <!-- Sidebar de Navegação e Ações -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-placeholder" id="logo-container">
                <span id="logo-fallback">JBS</span>
            </div>
            <div class="logo-text">
                <span class="brand-name">JBS | Seara</span>
                <span class="brand-sub" id="device-badge">Catálogo de Itens</span>
            </div>
        </div>

        <!-- Seletor de Temas Reformulado -->
        <div class="sidebar-theme-container">
            <span class="theme-label">🎨 APARÊNCIA DO SISTEMA</span>
            <div class="theme-selector-grid">
                <button class="theme-chip" onclick="aplicarTema('blue')">
                    <span class="theme-dot dot-blue"></span>
                    <span>Azul JBS</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('red')">
                    <span class="theme-dot dot-red"></span>
                    <span>Seara</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('dark')">
                    <span class="theme-dot dot-dark"></span>
                    <span>Noturno</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('apple')">
                    <span class="theme-dot dot-apple"></span>
                    <span>Apple Glass</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('emerald')">
                    <span class="theme-dot dot-emerald"></span>
                    <span>Emerald</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('nordic')">
                    <span class="theme-dot dot-nordic"></span>
                    <span>Nordic</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('cyber')">
                    <span class="theme-dot dot-cyber"></span>
                    <span>Cyber Tech</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('titanium')">
                    <span class="theme-dot dot-titanium"></span>
                    <span>Titanium</span>
                </button>
                <button class="theme-chip" onclick="aplicarTema('sunset')">
                    <span class="theme-dot dot-sunset"></span>
                    <span>Sunset</span>
                </button>
            </div>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-title">Navegação</span>
            <a href="#" class="nav-item active">
                <span>🔍</span>
                <span>Pesquisa de Itens</span>
            </a>
        </nav>

        <div class="sidebar-actions-container">
            <span class="nav-section-title" style="padding: 0 0 4px 0;">Ações do Sistema</span>
            <button class="btn-sidebar-action" onclick="conectarPastaImagens()">📂 Conectar Pasta Imagens</button>
            <button class="btn-sidebar-action" onclick="mapearPastaImagensServidor()">🖼️ Carregar Imagens</button>
            <label class="btn-sidebar-action" style="cursor:pointer; display:block; text-align:center;">
                📂 Selecionar Planilha
                <input type="file" id="input-arquivo" accept=".xlsx, .xlsb, .csv, .xls" style="display:none;" onchange="carregarArquivoManual(event)">
            </label>
            <button class="btn-sidebar-action" onclick="carregarCSV()">🔄 Sincronizar Base</button>
        </div>
    </aside>

    <!-- Painel de Segmentação -->
    <aside class="filter-panel-left" id="panel-segmentacao">
        <div class="panel-header">
            <span class="panel-title">⚡ Segmentação</span>
            <button class="btn-toggle-filter" onclick="toggleSegmentacao()" title="Ocultar Filtros">◀</button>
        </div>

        <div class="filter-panel-body">
            <div class="filter-group">
                <label class="filter-label">🖼️ Imagem do Item:</label>
                <select id="select-imagem" class="segmentation-select" onchange="filtrar()">
                    <option value="">Todas as Fotos</option>
                    <option value="com_foto">📸 Com Imagem</option>
                    <option value="sem_foto">🚫 Sem Imagem</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">🏢 Fornecedor:</label>
                <select id="select-fornecedor" class="segmentation-select" onchange="filtrar()">
                    <option value="">Todos os Fornecedores</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">⚙️ Local de Aplicação:</label>
                <select id="select-aplicacao" class="segmentation-select" onchange="filtrar()">
                    <option value="">Todos os Locais</option>
                </select>
            </div>

            <button class="btn-reset-filters" onclick="limparFiltrosSegmentacao()">🧹 Limpar Filtros</button>
        </div>
    </aside>

    <button class="btn-reopen-filter" id="btn-reopen-filter" onclick="toggleSegmentacao()" title="Exibir Segmentação de Dados">⚡ Filtros ▶</button>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="main-content">
        <div class="container">
            <div class="fixed-top-section">
                <header>
                    <h1>Almoxarifado JBS | Seara</h1>
                </header>

                <input type="text" id="busca" class="search-box" placeholder="Digite código, nome, equipamento, localização, especificação, aplicação, fornecedor..." oninput="filtrar()">

                <div class="status">
                    <span id="status-texto">Procurando base de dados e arquivo de saldos...</span>
                    <span id="contador-itens"></span>
                </div>
            </div>

            <div class="scrollable-results-section" id="scrollable-results-section">
                <div id="resultados"></div>

                <div class="pagination" id="paginacao" style="display: none;">
                    <button class="btn-page" id="btn-ant" onclick="mudarPagina(-1)">❮ Anterior</button>
                    <span id="info-pagina" style="font-weight: bold;">Página 1</span>
                    <button class="btn-page" id="btn-prox" onclick="mudarPagina(1)">Próximo ❯</button>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="hover-card" class="hover-card"></div>

<div class="modal-overlay" id="modal-item" onclick="fecharModalFora(event)">
    <div class="modal-card">
        <span class="modal-close" onclick="fecharModal()">&times;</span>
        <div id="modal-conteudo"></div>
    </div>
</div>

<script>
    let dadosCSV = [];
    let dadosFiltrados = [];
    let mapaSaldos = new Map();
    let ultimaAtualizacaoSaldo = 'Não carregado';
    let paginaAtual = 1;
    const ITENS_POR_PAGINA = 20;
    let isMobile = false;

    let pastaImagensHandle = null;
    
    const itensComFoto = new Set();
    const cacheCaminhoFoto = new Map();
    const cachePDFs = new Map();

    const FORMATOS_SUPORTADOS = ['dados.csv', 'dados.xlsx', 'dados.xlsb', 'dados.xls'];

    function toggleSegmentacao() {
        const layout = document.getElementById('app-layout');
        layout.classList.toggle('segmentation-hidden');
        const oculto = layout.classList.contains('segmentation-hidden');
        localStorage.setItem('jbs_segmentation_hidden', oculto ? 'true' : 'false');
    }

    function carregarEstadoSegmentacao() {
        const estadoSalvo = localStorage.getItem('jbs_segmentation_hidden');
        const layout = document.getElementById('app-layout');
        if (estadoSalvo === 'false') {
            layout.classList.remove('segmentation-hidden');
        } else {
            layout.classList.add('segmentation-hidden');
        }
    }

    function aplicarTema(tema) {
        if (tema === 'blue') {
            document.documentElement.removeAttribute('data-theme');
        } else {
            document.documentElement.setAttribute('data-theme', tema);
        }
        localStorage.setItem('jbs_theme_preference', tema);
        
        document.querySelectorAll('.theme-chip').forEach(chip => chip.classList.remove('active'));
        const chipAtivo = document.querySelector(`.theme-chip[onclick="aplicarTema('${tema}')"]`);
        if (chipAtivo) chipAtivo.classList.add('active');
    }

    function carregarTemaSalvo() {
        const temaSalvo = localStorage.getItem('jbs_theme_preference') || 'blue';
        aplicarTema(temaSalvo);
    }

    function detectarDispositivo() {
        const telaPequena = window.innerWidth <= 900;
        const eTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        isMobile = telaPequena || (eTouch && window.innerWidth <= 1024);

        const body = document.body;
        const badge = document.getElementById('device-badge');

        if (isMobile) {
            body.classList.remove('desktop-mode');
            body.classList.add('mobile-mode');
            if (badge) badge.innerText = '📱 Modo Mobile';
        } else {
            body.classList.remove('mobile-mode');
            body.classList.add('desktop-mode');
            if (badge) badge.innerText = '💻 Modo Desktop';
        }
    }

    async function conectarPastaImagens() {
        if ('showDirectoryPicker' in window) {
            try {
                pastaImagensHandle = await window.showDirectoryPicker();
                alert("✅ Pasta 'imagens' conectada com sucesso!");
                await mapearFotosLocaisCelular();
            } catch (err) {
                console.log("Seleção de pasta cancelada.");
            }
        } else {
            alert("⚠️ Seu navegador não suporta gravação direta de diretório. As fotos serão salvas via download.");
        }
    }

    async function mapearFotosLocaisCelular() {
        if (!pastaImagensHandle) return;
        try {
            for await (const entry of pastaImagensHandle.values()) {
                if (entry.kind === 'file') {
                    const nome = entry.name;
                    const matchCap = nome.match(/(.+?)\s*[-_]\s*\d{2}\.[a-zA-Z0-9]+$/i);
                    if (matchCap && matchCap[1]) {
                        const cod = matchCap[1].trim();
                        itensComFoto.add(cod);
                        if (!cacheCaminhoFoto.has(cod)) {
                            cacheCaminhoFoto.set(cod, `imagens/${nome}`);
                        }
                    }
                }
            }
            renderizarPagina();
        } catch (e) {
            console.error(e);
        }
    }

    async function mapearPastaImagensServidor() {
        const statusDiv = document.getElementById('status-texto');
        statusDiv.innerText = "🔄 Varrendo e carregando imagens da pasta /imagens no GitHub...";

        try {
            const pathname = window.location.pathname.split('/').filter(Boolean);
            const user = window.location.hostname.split('.')[0];
            const repo = pathname[0];

            if (user && repo) {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/imagens`);
                if (response.ok) {
                    const arquivos = await response.json();
                    
                    arquivos.forEach(arquivo => {
                        const nome = arquivo.name;
                        const matchCap = nome.match(/(.+?)\s*[-_]\s*01\.[a-zA-Z0-9]+$/i);
                        if (matchCap && matchCap[1]) {
                            const cod = matchCap[1].trim();
                            itensComFoto.add(cod);
                            cacheCaminhoFoto.set(cod, `imagens/${nome}`);
                        }
                    });

                    statusDiv.innerText = `✅ Carregamento concluído! Imagens vinculadas a ${itensComFoto.size} itens.`;
                    renderizarPagina();
                    return;
                }
            }
        } catch (e) {
            console.warn("Consulta via GitHub API não disponível.", e);
        }

        statusDiv.innerText = "⚠️ Mapeamento automático indisponível. Conecte a pasta local pelo botão '📂 Conectar Pasta Imagens'.";
    }

    function carregarLogoUniversal() {
        const logoContainer = document.getElementById('logo-container');
        const extensoesLogo = ['png', 'jpg', 'jpeg', 'webp', 'svg'];
        let encontrada = false;

        extensoesLogo.forEach(ext => {
            if (encontrada) return;
            const caminhosTestar = [`logo.${ext}`, `imagens/logo.${ext}`];
            caminhosTestar.forEach(caminho => {
                if (encontrada) return;
                const img = new Image();
                img.onload = () => {
                    if (!encontrada) {
                        encontrada = true;
                        logoContainer.innerHTML = `<img src="${caminho}" alt="Logo JBS Seara" style="width:100%; height:100%; object-fit:contain;">`;
                    }
                };
                img.src = caminho;
            });
        });
    }

    function normalizarCod(val) {
        if (val === undefined || val === null) return '';
        return String(val).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/^0+/, '').trim();
    }

    function getVal(item, termosChave) {
        if (!item || typeof item !== 'object') return '-';
        const keys = Object.keys(item);
        for (const termo of termosChave) {
            const termoNorm = termo.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (const key of keys) {
                const keyNorm = key.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (keyNorm === termoNorm || keyNorm.includes(termoNorm)) {
                    const val = item[key];
                    if (val !== undefined && val !== null && String(val).trim() !== '') {
                        return String(val).trim();
                    }
                }
            }
        }
        return '-';
    }

    // SINCRONIZAÇÃO AUTOMÁTICA DO SALDO.CSV COM BYPASS DE CACHE
    async function carregarSaldos() {
        mapaSaldos.clear();
        try {
            const resposta = await fetch('saldo.csv?t=' + new Date().getTime(), { cache: 'no-cache' });
            if (resposta.ok) {
                const headerData = resposta.headers.get('Last-Modified');
                if (headerData) {
                    const dataObj = new Date(headerData);
                    ultimaAtualizacaoSaldo = dataObj.toLocaleString('pt-BR');
                } else {
                    ultimaAtualizacaoSaldo = new Date().toLocaleString('pt-BR');
                }

                const buffer = await resposta.arrayBuffer();
                const workbook = XLSX.read(buffer, { type: 'array' });
                const primeiraAba = workbook.Sheets[workbook.SheetNames[0]];
                const dadosSaldo = XLSX.utils.sheet_to_json(primeiraAba, { defval: "" });

                dadosSaldo.forEach(linha => {
                    const codBruto = getVal(linha, ['cod_item', 'codigo', 'cod', 'item']);
                    const saldoVal = getVal(linha, ['saldo_atual', 'saldo', 'qtd', 'quantidade', 'est_atual', 'estoque']);
                    
                    const codNorm = normalizarCod(codBruto);
                    if (codNorm) {
                        const numSaldo = parseFloat(String(saldoVal).replace(',', '.')) || 0;
                        mapaSaldos.set(codNorm, numSaldo);
                    }
                });
            }
        } catch (e) {
            console.warn("Arquivo saldo.csv não encontrado no servidor.", e);
        }
    }

    async function carregarCSV() {
        const statusDiv = document.getElementById('status-texto');
        statusDiv.innerText = "Sincronizando dados e arquivo de saldos...";

        await carregarSaldos();

        let arquivoEncontrado = null;
        let bufferArquivo = null;

        for (const arquivo of FORMATOS_SUPORTADOS) {
            try {
                const resposta = await fetch(`${arquivo}?t=` + new Date().getTime(), { cache: 'no-cache' });
                if (resposta.ok) {
                    arquivoEncontrado = arquivo;
                    bufferArquivo = await resposta.arrayBuffer();
                    break;
                }
            } catch (e) {}
        }

        if (!arquivoEncontrado || !bufferArquivo) {
            statusDiv.innerText = "⚠️ Clique em '📂 Selecionar Planilha' para carregar a base de dados.";
            return;
        }

        processarBuffer(bufferArquivo, arquivoEncontrado);
    }

    function carregarArquivoManual(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            await carregarSaldos();
            processarBuffer(e.target.result, file.name);
        };
        reader.readAsArrayBuffer(file);
    }

    function processarBuffer(buffer, nomeArquivo) {
        const statusDiv = document.getElementById('status-texto');
        try {
            const workbook = XLSX.read(buffer, { type: 'array' });
            const primeiraAba = workbook.Sheets[workbook.SheetNames[0]];
            const dadosBrutos = XLSX.utils.sheet_to_json(primeiraAba, { defval: "" });
            
            dadosCSV = dadosBrutos.filter(item => {
                const codBruto = getVal(item, ['cod_item', 'codigo', 'cod']);
                const codNorm = normalizarCod(codBruto);
                
                if (mapaSaldos.has(codNorm)) {
                    return mapaSaldos.get(codNorm) > 0;
                }
                return true;
            });

            dadosFiltrados = dadosCSV;
            paginaAtual = 1;

            popularSegmentacaoDados();

            statusDiv.innerText = `✅ Base (${nomeArquivo}) carregada! (${dadosCSV.length} itens com saldo)`;
            renderizarPagina();
        } catch (error) {
            statusDiv.innerText = `⚠️ Erro ao ler o arquivo ${nomeArquivo}: ${error.message}`;
        }
    }

    function popularSegmentacaoDados() {
        const selectForn = document.getElementById('select-fornecedor');
        const selectAplic = document.getElementById('select-aplicacao');

        const fornecedoresUnicos = new Set();
        const aplicacoesUnicas = new Set();

        dadosCSV.forEach(item => {
            const forn = getVal(item, ['cod_fornecedor', 'fornecedor', 'forn']);
            const aplic = getVal(item, ['locais_aplicacao', 'aplicacao']);

            if (forn && forn !== '-') fornecedoresUnicos.add(forn);
            if (aplic && aplic !== '-') aplicacoesUnicas.add(aplic);
        });

        selectForn.innerHTML = '<option value="">Todos os Fornecedores</option>';
        Array.from(fornecedoresUnicos).sort().forEach(f => {
            selectForn.innerHTML += `<option value="${f}">${f}</option>`;
        });

        selectAplic.innerHTML = '<option value="">Todos os Locais</option>';
        Array.from(aplicacoesUnicas).sort().forEach(a => {
            selectAplic.innerHTML += `<option value="${a}">${a}</option>`;
        });
    }

    function limparFiltrosSegmentacao() {
        document.getElementById('select-imagem').value = "";
        document.getElementById('select-fornecedor').value = "";
        document.getElementById('select-aplicacao').value = "";
        filtrar();
    }

    function renderizarPagina() {
        const divContainer = document.getElementById('resultados');
        const contDiv = document.getElementById('contador-itens');
        const paginacaoDiv = document.getElementById('paginacao');
        divContainer.innerHTML = '';

        const totalItens = dadosFiltrados.length;

        let comFoto = 0;
        dadosFiltrados.forEach(item => {
            const cod = getVal(item, ['cod_item', 'codigo', 'cod']);
            const codLimpo = String(cod).trim();
            if (itensComFoto.has(codLimpo)) {
                comFoto++;
            }
        });

        const semFoto = totalItens - comFoto;
        const percComFoto = totalItens > 0 ? ((comFoto / totalItens) * 100).toFixed(1) : 0;
        const percSemFoto = totalItens > 0 ? ((semFoto / totalItens) * 100).toFixed(1) : 0;

        contDiv.innerHTML = `
            <div style="text-align: right; line-height: 1.4;">
                <div><strong>Total:</strong> ${totalItens} itens com saldo &nbsp;|&nbsp; 
                <span style="color:var(--text-success, #16a34a); font-weight:700;">📸 Com Foto:</span> ${comFoto} (${percComFoto}%) &nbsp;|&nbsp; 
                <span style="color:var(--text-danger, #dc2626); font-weight:700;">🚫 Sem Foto:</span> ${semFoto} (${percSemFoto}%)</div>
                <div style="font-size: 11px; opacity: 0.85; margin-top: 2px;">🕒 <strong>Última Atualização do Saldo Atual:</strong> ${ultimaAtualizacaoSaldo}</div>
            </div>
        `;

        if (totalItens === 0) {
            divContainer.innerHTML = '<p>Nenhum item encontrado com saldo maior que zero ou com os filtros aplicados.</p>';
            paginacaoDiv.style.display = 'none';
            return;
        }

        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const fim = Math.min(inicio + ITENS_POR_PAGINA, totalItens);
        const itensPagina = dadosFiltrados.slice(inicio, fim);

        itensPagina.forEach((item, index) => {
            const cod = getVal(item, ['cod_item', 'codigo', 'cod']);
            const nome = getVal(item, ['nome_item', 'nome', 'item', 'descricao']);
            const fornecedor = getVal(item, ['cod_fornecedor', 'fornecedor', 'forn']);
            const equipamento = getVal(item, ['equipamento', 'equip']);
            const especificacao = getVal(item, ['especificacao', 'espec']);
            const prateleira = getVal(item, ['prateleira', 'prat', 'rua']);
            const divisao = getVal(item, ['divisao', 'div', 'gaveta']);
            const reparticao = getVal(item, ['reparticao', 'rep', 'nicho']);
            const estMin = getVal(item, ['est_min', 'minimo']);
            const estMax = getVal(item, ['est_max', 'maximo']);
            const leadTime = getVal(item, ['lead_time', 'lead']);
            
            const codNorm = normalizarCod(cod);
            const saldoExibir = mapaSaldos.has(codNorm) ? mapaSaldos.get(codNorm) : '-';

            const indexReal = inicio + index;

            const row = document.createElement('div');
            row.className = 'item-row';
            
            row.onclick = () => abrirModal(indexReal);

            if (!isMobile) {
                row.onmousemove = (e) => mostrarHoverCard(e, indexReal);
                row.onmouseleave = esconderHoverCard;
            }

            row.innerHTML = `
                <div class="row-thumb" id="row-thumb-${indexReal}">
                    <span>Sem foto</span>
                </div>

                <div class="row-content">
                    <div class="row-title">Código: ${cod} — ${nome}</div>
                    <div class="row-details">
                        <span class="row-location">📍 P: ${prateleira} | D: ${divisao} | R: ${reparticao}</span>
                        <span class="row-stock-badge">📊 Saldo: ${saldoExibir} | Mín: ${estMin} | Máx: ${estMax}</span>
                        <span class="row-lead-badge">⏱️ Lead Time: ${leadTime}</span>
                        <span><strong>Forn:</strong> ${fornecedor}</span>
                        <span><strong>Equip:</strong> ${equipamento}</span>
                    </div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top:2px;">
                        <strong>Espec:</strong> ${especificacao}
                    </div>
                </div>
            `;
            divContainer.appendChild(row);

            carregarFotoCapaLinha(cod, indexReal);
        });

        const totalPaginas = Math.ceil(totalItens / ITENS_POR_PAGINA);
        if (totalPaginas > 1) {
            paginacaoDiv.style.display = 'flex';
            document.getElementById('info-pagina').innerText = `Página ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('btn-ant').disabled = (paginaAtual === 1);
            document.getElementById('btn-prox').disabled = (paginaAtual === totalPaginas);
        } else {
            paginacaoDiv.style.display = 'none';
        }
    }

    function carregarFotoCapaLinha(codItem, indexReal) {
        const thumbDiv = document.getElementById(`row-thumb-${indexReal}`);
        if (!codItem || codItem === '-') return;

        const codLimpo = String(codItem).trim();

        if (cacheCaminhoFoto.has(codLimpo)) {
            const src = cacheCaminhoFoto.get(codLimpo);
            if (src) {
                thumbDiv.innerHTML = `<img src="${src}" loading="lazy" alt="Foto Capa" id="img-capa-${indexReal}">`;
                return;
            }
        }

        const extensoes = ['jpg', 'png', 'jpeg', 'webp'];
        const padroes = [`${codLimpo} - 01`, `${codLimpo}-01`];
        let encontrada = false;

        const testarProxima = (pIndex, eIndex) => {
            if (encontrada || pIndex >= padroes.length) return;

            const src = `imagens/${padroes[pIndex]}.${extensoes[eIndex]}`;
            const img = new Image();
            
            img.onload = () => {
                if (!encontrada) {
                    encontrada = true;
                    itensComFoto.add(codLimpo);
                    cacheCaminhoFoto.set(codLimpo, src);
                    thumbDiv.innerHTML = `<img src="${src}" loading="lazy" alt="Foto Capa" id="img-capa-${indexReal}">`;
                }
            };

            img.onerror = () => {
                if (!encontrada) {
                    if (eIndex + 1 < extensoes.length) {
                        testarProxima(pIndex, eIndex + 1);
                    } else {
                        testarProxima(pIndex + 1, 0);
                    }
                }
            };

            img.src = src;
        };

        testarProxima(0, 0);
    }

    async function verificarPDFItem(codItem) {
        const codLimpo = String(codItem).trim();
        if (cachePDFs.has(codLimpo)) return cachePDFs.get(codLimpo);

        const caminhosTestar = [
            `arquivos/${codLimpo}/${codLimpo}.pdf`,
            `arquivos/${codLimpo}/documento.pdf`,
            `arquivos/${codLimpo}/ficha.pdf`,
            `arquivos/${codLimpo}.pdf`
        ];

        for (const path of caminhosTestar) {
            try {
                const res = await fetch(path, { method: 'HEAD' });
                if (res.ok) {
                    cachePDFs.set(codLimpo, path);
                    return path;
                }
            } catch (e) {}
        }

        cachePDFs.set(codLimpo, null);
        return null;
    }

    function mostrarHoverCard(e, indexReal) {
        if (isMobile) return;

        const item = dadosFiltrados[indexReal];
        const cardHover = document.getElementById('hover-card');
        const imgCapa = document.getElementById(`img-capa-${indexReal}`);
        
        const cod = getVal(item, ['cod_item', 'codigo', 'cod']);
        const nome = getVal(item, ['nome_item', 'nome', 'item', 'descricao']);
        const estMin = getVal(item, ['est_min', 'minimo']);
        const estMax = getVal(item, ['est_max', 'maximo']);
        const leadTime = getVal(item, ['lead_time', 'lead']);
        const especificacao = getVal(item, ['especificacao', 'espec']);
        const locaisAplicacao = getVal(item, ['locais_aplicacao', 'aplicacao']);

        const srcFoto = imgCapa ? imgCapa.src : '';
        const tagFoto = srcFoto ? `<img src="${srcFoto}" class="hover-card-img">` : '<div class="hover-card-img" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">Sem Imagem</div>';

        cardHover.innerHTML = `
            ${tagFoto}
            <div class="hover-card-title">[${cod}] ${nome}</div>
            <div class="hover-card-section"><strong>📊 Estoque Mín / Máx:</strong> ${estMin} / ${estMax}</div>
            <div class="hover-card-section"><strong>⏱️ Lead Time de Entrega:</strong> ${leadTime}</div>
            <div class="hover-card-section"><strong>🛠️ Especificações:</strong><br>${especificacao}</div>
            <div class="hover-card-section"><strong>⚙️ Locais de Aplicação:</strong><br>${locaisAplicacao}</div>
        `;

        let posX = e.clientX + 20;
        let posY = e.clientY + 10;

        if (posX + 350 > window.innerWidth) posX = e.clientX - 350;
        if (posY + 370 > window.innerHeight) posY = window.innerHeight - 380;

        cardHover.style.left = posX + 'px';
        cardHover.style.top = posY + 'px';
        cardHover.style.display = 'block';
    }

    function esconderHoverCard() {
        document.getElementById('hover-card').style.display = 'none';
    }

        const equipamento = getVal(item, ['equipamento', 'equip']);
        const especificacao = getVal(item, ['especificacao', 'espec']);
        const prateleira = getVal(item, ['prateleira', 'prat', 'rua']);
        const divisao = getVal(item, ['divisao', 'div', 'gaveta']);
        const reparticao = getVal(item, ['reparticao', 'rep', 'nicho']);
        const locaisAplicacao = getVal(item, ['locais_aplicacao', 'aplicacao']);
        const estMin = getVal(item, ['est_min', 'minimo']);
        const estMax = getVal(item, ['est_max', 'maximo']);
        const leadTime = getVal(item, ['lead_time', 'lead']);

        const codNorm = normalizarCod(cod);
        const saldoExibir = mapaSaldos.has(codNorm) ? mapaSaldos.get(codNorm) : '-';

        let camposExtrasHTML = '';

            'cod_item','codigo','cod','nome_item','nome','item','descricao',
            'cod_fornecedor','fornecedor','forn','equipamento','equip','especificacao','espec',
            'prateleira','prat','rua','divisao','div','gaveta','reparticao','rep','nicho',
            'locais_aplicacao','aplicacao','est_min','estmin','minimo','est_max','estmax','maximo','lead_time','leadtime','lead'
        ];
        
        Object.keys(item).forEach(key => {
            const keyNorm = key.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!chavesIgnorar.some(p => keyNorm === p || keyNorm.includes(p))) {

                    camposExtrasHTML += `<p><strong>${key}:</strong> ${item[key]}</p>`;
                }

            <h2 style="color:var(--primary-color); margin-top:0; font-size:18px; font-weight:700;">[Código: ${cod}] — ${nome}</h2>
            <div class="modal-body">

                    <div style="background:var(--bg-subcard); border:1px solid var(--border-color); padding:10px 14px; border-radius:8px; margin-bottom:10px; color:var(--text-primary);">
                        <p style="margin:2px 0;">📍 <strong>Prateleira:</strong> ${prateleira} &nbsp;|&nbsp; 📂 <strong>Divisão:</strong> ${divisao} &nbsp;|&nbsp; 📦 <strong>Repartição:</strong> ${reparticao}</p>
                    </div>

                    <div style="background:var(--bg-subcard); color:var(--text-primary); padding:10px 14px; border-radius:8px; margin-bottom:16px; border:1px solid var(--border-color);">
                        <p style="margin:2px 0;">📊 <strong>Saldo em Estoque:</strong> <strong>${saldoExibir} un.</strong></p>
                        <p style="margin:2px 0;">📈 <strong>Estoque Mín / Máx:</strong> ${estMin} / ${estMax} un. &nbsp;|&nbsp; ⏱️ <strong>Lead Time:</strong> ${leadTime}</p>
                    </div>

                    <p><strong>Cód. Fornecedor:</strong> ${fornecedor}</p>
                    <p><strong>Equipamento Principal:</strong> ${equipamento}</p>
                    <p><strong>Especificações Técnicas:</strong> ${especificacao}</p>
                    <p><strong>Locais de Aplicação:</strong> ${locaisAplicacao}</p>
                    
                    ${camposExtrasHTML}

                    <div id="pdf-container-btn" style="margin-top: 12px;"></div>

                    <div class="camera-section">
                        <label class="btn-camera">
                            📸 Retirar Foto da Prateleira
                            <input type="file" id="input-camera" accept="image/*" capture="environment" style="display:none;" onchange="salvarFotoCapturada(event, '${cod}')">
                        </label>
                        <span id="camera-status"></span>
                    </div>

                    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Ficha PDF</button>
                </div>

                <div class="modal-gallery">
                    <div class="main-media-box" id="modal-media-box">
                        <span>Carregando mídias...</span>

        if (pathPDF && pdfBtnContainer) {
            pdfBtnContainer.innerHTML = `
                <a href="${pathPDF}" target="_blank" class="btn-pdf-link">
                    📄 Abrir Documento Técnico (PDF)
                </a>
            `;
        }
    }

    async function salvarFotoCapturada(event, codItem) {
        const file = event.target.files[0];
        const statusText = document.getElementById('camera-status');
        if (!file || !codItem || codItem === '-') return;

        const codLimpo = String(codItem).trim();
        statusText.innerText = "Verificando sequência na pasta local...";

        let proximaSequencia = 1;

        if (pastaImagensHandle) {
            try {
                let maiorSeqLocal = 0;

                for await (const entry of pastaImagensHandle.values()) {
                    if (entry.kind === 'file') {
                        const nomeArquivo = entry.name;
                        if (nomeArquivo.toLowerCase().startsWith(codLimpo.toLowerCase())) {
                            const match = nomeArquivo.match(/[-_]\s*(\d{2})/);
                            if (match && match[1]) {
                                const numSeq = parseInt(match[1], 10);
                                if (numSeq > maiorSeqLocal) {
                                    maiorSeqLocal = numSeq;
                                }
                            }
                        }
                    }
                }

                proximaSequencia = maiorSeqLocal + 1;
                const seqFormatada = proximaSequencia < 10 ? `0${proximaSequencia}` : `${proximaSequencia}`;
                const nomeFinal = `${codLimpo} - ${seqFormatada}.jpg`;

                const fileHandle = await pastaImagensHandle.getFileHandle(nomeFinal, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(file);
                await writable.close();

                statusText.innerText = `✅ Salvo na pasta local: ${nomeFinal}`;
                
                itensComFoto.add(codLimpo);
                carregarMidiasCompletas(codItem, true);
                return;
            } catch (err) {
                console.error("Erro ao ler/gravar na pasta conectada:", err);
                statusText.innerText = "⚠️ Erro ao acessar pasta local. Tentando modo de download...";
            }
        }

        const imagensGaleria = document.querySelectorAll('#modal-thumbs-box .thumb-item img');
        let maiorSequencia = 0;

        imagensGaleria.forEach(img => {
            const src = decodeURIComponent(img.src);
            const match = src.match(/[-_]\s*(\d{2})/);
            if (match && match[1]) {
                const numSeq = parseInt(match[1], 10);
                if (numSeq > maiorSequencia) maiorSequencia = numSeq;
            }
        });

        proximaSequencia = maiorSequencia + 1;
        const seqFormatada = proximaSequencia < 10 ? `0${proximaSequencia}` : `${proximaSequencia}`;
        const nomeFinal = `${codLimpo} - ${seqFormatada}.jpg`;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(file);
        a.download = nomeFinal;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusText.innerText = `💾 Baixado: ${nomeFinal}`;
    }

    async function carregarMidiasCompletas(codItem, forcarReload = false) {
        const mediaBox = document.getElementById('modal-media-box');
        const thumbsBox = document.getElementById('modal-thumbs-box');
        thumbsBox.innerHTML = '';

        if (!codItem || codItem === '-') {
            mediaBox.innerHTML = '<span style="font-size:12px; color:#999;">Sem imagens/vídeos</span>';
            return;
        }

        const codLimpo = String(codItem).trim();
        const extensoes = ['jpg', 'png', 'jpeg', 'webp'];
        let midias = [];

        const timestamp = forcarReload ? `?v=${new Date().getTime()}` : '';

        for (let seq = 1; seq <= 10; seq++) {
            const numSeq = seq < 10 ? `0${seq}` : `${seq}`;
            let achouNaSeq = false;

            for (const ext of extensoes) {
                const src = `imagens/${codLimpo} - ${numSeq}.${ext}${timestamp}`;
                const existe = await new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = src;
                });

                if (existe) {
                    midias.push({ tipo: 'foto', seq: seq, src: src });
                    achouNaSeq = true;
                    break;
                }
            }

            if (!achouNaSeq) {
                break;
            }
        }

        if (midias.length === 0) {
            mediaBox.innerHTML = '<span style="font-size:12px; color:#999;">Sem imagens/vídeos</span>';
            return;
        }

        exibirNoPlayer(midias[0], mediaBox);

        midias.forEach((m, i) => {
            const thumb = document.createElement('div');
            thumb.className = `thumb-item ${i === 0 ? 'active' : ''}`;

            const img = document.createElement('img');
            img.src = m.src;
            thumb.appendChild(img);

            thumb.onclick = () => {
                exibirNoPlayer(m, mediaBox);
                thumbsBox.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
                thumb.classList.add('active');
            };

            thumbsBox.appendChild(thumb);
        });
    }

    function exibirNoPlayer(midia, container) {
        if (midia.tipo === 'video') {
            container.innerHTML = `
                <video src="${midia.src}" autoplay loop muted playsinline controls>
                    Seu navegador não suporta vídeos.
                </video>
            `;
        } else {
            container.innerHTML = `<img src="${midia.src}" alt="Foto Peça">`;
        }
    }

    function fecharModal() {
        document.getElementById('modal-item').style.display = 'none';
        document.getElementById('modal-conteudo').innerHTML = '';
    }

    function fecharModalFora(e) {
        if (e.target.id === 'modal-item') fecharModal();
    }

    function mudarPagina(direcao) {
        paginaAtual += direcao;
        renderizarPagina();
        
        const areaScroll = document.getElementById('scrollable-results-section');
        if (areaScroll) {
            areaScroll.scrollTop = 0;
        }
    }

    function filtrar() {
        const termo = document.getElementById('busca').value.toLowerCase().trim();
        const fornSel = document.getElementById('select-fornecedor').value.toLowerCase().trim();
        const aplicSel = document.getElementById('select-aplicacao').value.toLowerCase().trim();
        const imagemSel = document.getElementById('select-imagem').value;

        dadosFiltrados = dadosCSV.filter(item => {
            const cod = getVal(item, ['cod_item', 'codigo', 'cod']);
            const codLimpo = String(cod).trim();

            const linhaCompleta = Object.values(item).join(' ').toLowerCase();
            const fornItem = getVal(item, ['cod_fornecedor', 'fornecedor', 'forn']).toLowerCase();
            const aplicItem = getVal(item, ['locais_aplicacao', 'aplicacao']).toLowerCase();

            const bateTexto = !termo || linhaCompleta.includes(termo);
            const bateForn = !fornSel || fornItem === fornSel;
            const bateAplic = !aplicSel || aplicItem === aplicSel;

            let bateImagem = true;
            if (imagemSel) {
                const temFoto = itensComFoto.has(codLimpo);
                if (imagemSel === 'com_foto') {
                    bateImagem = temFoto;
                } else if (imagemSel === 'sem_foto') {
                    bateImagem = !temFoto;
                }
            }

            return bateTexto && bateForn && bateAplic && bateImagem;
        });

        paginaAtual = 1;
        renderizarPagina();
    }

    window.addEventListener('resize', detectarDispositivo);

    window.onload = () => {
        carregarTemaSalvo();
        carregarEstadoSegmentacao();
        detectarDispositivo();
        carregarLogoUniversal();
        carregarCSV();
    };
</script>
