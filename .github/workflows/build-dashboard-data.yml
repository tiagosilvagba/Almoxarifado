name: Build dashboard data
on:
  push:
    branches: [main]
    paths:
      - '01 - Compras_Almox_Parte_*.CSV'
      - '00 - Saldo_Online.csv'
      - '02 - Responsaveis_Reposição.CSV'
      - '03 - Consumo.csv'
      - '03 - Itens_Sem_Giro.csv'
      - 'processor/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact data
        run: python processor/build_data.py
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados otimizados do dashboard"
          git push