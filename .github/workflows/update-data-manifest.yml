name: Preparar bases de dados

on:
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "*.CSV"
      - "tools/build_manifest.py"
      - "tools/build_catalog.mjs"
      - "tools/build_consumption.py"
      - "tools/build_stock_history.mjs"
      - "consumo-mensal/**"
      - "03 - Consumo_*.csv"
      - "03 - Consumo_*.CSV"
      - "app/core/catalog-app.js"
      - ".github/workflows/update-data-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar manifesto
        run: python tools/build_manifest.py
      - name: Consolidar CSVs mensais de consumo
        run: python tools/build_consumption.py
      - name: Gerar base compactada
        run: node tools/build_catalog.mjs
      - name: Registrar histórico permanente de estoque
        run: node tools/build_stock_history.mjs
      - name: Publicar bases atualizadas
        run: |
          if [ -z "$(git status --porcelain -- data-manifest.json data/update-times.json data/catalog.json.gz data/catalog-meta.json data/consumo-consolidado.csv data/consumo-meta.json data/historico-estoque)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-manifest.json data/catalog.json.gz data/catalog-meta.json data/consumo-consolidado.csv data/consumo-meta.json data/historico-estoque
          git commit -m "Atualiza bases otimizadas e guarda histórico permanente de estoque"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "A publicação encontrou outro commit; tentando novamente ($attempt/3)."
          done

          echo "Não foi possível publicar a base após 3 tentativas."
          exit 1
