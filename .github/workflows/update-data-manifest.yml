name: Atualizar manifesto de dados

on:
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "*.CSV"
      - "tools/build_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar manifesto
        run: python tools/build_manifest.py
      - name: Publicar manifesto atualizado
        run: |
          if git diff --quiet -- data-manifest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-manifest.json
          git commit -m "Atualiza manifesto dos CSVs"
          git push
