name: Preparar bases de dados

on:
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "*.CSV"
      - "tools/build_manifest.py"
      - "tools/build_catalog.mjs"
      - "app/core/catalog-app.js"
      - ".github/workflows/update-data-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar manifesto
        run: python tools/build_manifest.py
      - name: Gerar base compactada
        run: node tools/build_catalog.mjs
      - name: Publicar bases atualizadas
        run: |
          if [ -z "$(git status --porcelain -- data-manifest.json data/catalog.json.gz data/catalog-meta.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-manifest.json data/catalog.json.gz data/catalog-meta.json
          git commit -m "Atualiza bases otimizadas"
          git push
